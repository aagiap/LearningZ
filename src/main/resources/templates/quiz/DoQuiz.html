<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${quiz.getLesson().getTitle()}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <link href='https://use.fontawesome.com/releases/v5.7.2/css/all.css' rel='stylesheet'>
    <link rel="stylesheet" href="/css/DoQuiz.css">
</head>
<body>
<div>
    <div class="nav-header">
        <div class="left-section">
            <button class="menu-button">
                <i class="fas fa-tag"></i>
            </button>
            <h2 th:text="${quiz.getLesson().getTitle()}">
            </h2>
        </div>

        <div class="right-section">
            <div class="timer">
                <i class="far fa-clock"></i>
                <span id="countdown"></span>
            </div>
        </div>
    </div>
</div>
<form action="/Exam/CheckProgress" method="post">
    <div style="display: flex;justify-content:center">
        <div>
            <th:block th:each="question, questionStat : ${questionBankList}">
                <div class="container- mt-sm-5 my-1" th:id="'question-' + ${questionStat.index}">
                    <span th:text="'Question ' + ${questionStat.index + 1}"></span>
                    <div class="question ml-sm-5 pl-sm-5 pt-2">
                        <div class="py-2 h5"><b th:text="${question.getContent()}"></b></div>
                        <div class="pt-3 options-container" id="options">
                            <label class="options">
                                <span th:text="${question.getOption1()}"></span>
                                <input type="radio" th:name="'answers[' + ${questionStat.index} + '].selectedOption'"
                                       th:value="${question.getOption1()}"
                                       th:data-index="${questionStat.index}">
                                <span class="checkmark"></span>
                            </label>
                            <label class="options">
                                <span th:text="${question.getOption2()}"></span>
                                <input type="radio" th:name="'answers[' + ${questionStat.index} + '].selectedOption'"
                                       th:value="${question.getOption2()}"
                                       th:data-index="${questionStat.index}">
                                <span class="checkmark"></span>
                            </label>
                            <label class="options">
                                <span th:text="${question.getOption3()}"></span>
                                <input type="radio" th:name="'answers[' + ${questionStat.index} + '].selectedOption'"
                                       th:value="${question.getOption3()}"
                                       th:data-index="${questionStat.index}">
                                <span class="checkmark"></span>
                            </label>
                            <label class="options">
                                <span th:text="${question.getOption4()}"></span>
                                <input type="radio" th:name="'answers[' + ${questionStat.index} + '].selectedOption'"
                                       th:value="${question.getOption4()}"
                                       th:data-index="${questionStat.index}">
                                <span class="checkmark"></span>
                            </label>
                        </div>
                        <input type="hidden" th:name="'answers[' + ${questionStat.index} + '].questionId'"
                               th:value="${questionStat.index}">
                        <input type="hidden" th:name="'answers[' + ${questionStat.index} + '].correctAnswer'"
                               th:value="${question.getCorrectOption()}">
                    </div>
                </div>
            </th:block>
        </div>

        <!-- BOX CONTAINER -->
        <div style="margin-left: 50px;">
            <div class="box-container" style="position: fixed">
                <div class="box" th:each="question, questionStat : ${questionBankList}"
                     th:id="'box-' + ${questionStat.index}"
                     th:attr="onclick='scrollToQuestion(' + ${questionStat.index} + ')'">
                    <span th:text="${#numbers.formatInteger(questionStat.index + 1, 0)}"></span>
                </div>
                <div class="d-flex " style="margin: auto">
                    <button class="btn btn-success">Submit</button>
                </div>
            </div>

        </div>

    </div>
    <div class="d-flex justify-content-center align-items-center pt-3" style="margin-bottom: 50px;">
        <div class="d-flex ">
            <button class="btn btn-success">Submit</button>
        </div>
    </div>
</form>
<input type="hidden" id="timeLimitInput" th:value="${timeLimitSeconds}">

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Khi chọn radio button, đổi màu box tương ứng
        document.querySelectorAll('input[type="radio"]').forEach(function(radio) {
            radio.addEventListener('change', function() {
                let index = this.getAttribute('data-index');
                let box = document.getElementById("box-" + index);
                if (box) {
                    box.classList.add("selected"); // Đổi màu khi chọn
                }
            });
        });
    });

    // Hàm cuộn đến câu hỏi tương ứng khi nhấn vào box
    function scrollToQuestion(index) {
        let questionElement = document.getElementById("question-" + index);
        if (questionElement) {
            questionElement.scrollIntoView({ behavior: "smooth", block: "center" });
        }
    }

</script>
<script>
    let countdownElement = document.getElementById('countdown');
    let startTime, endTime;

    function startTimer() {
        let storedEndTime = localStorage.getItem('endTime');

        if (storedEndTime) {
            endTime = parseInt(storedEndTime);
        } else {
            let timeLimit = parseInt(document.getElementById('timeLimitInput').value) || 0;
            startTime = Date.now();
            endTime = startTime + timeLimit * 1000;
            localStorage.setItem('endTime', endTime);
        }

        updateCountdown();
    }

    function updateCountdown() {
        let now = Date.now();
        let timeLeft = Math.max(0, Math.floor((endTime - now) / 1000));

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        countdownElement.textContent =
            minutes.toString().padStart(2, '0') + ':' +
            seconds.toString().padStart(2, '0');

        if (timeLeft > 0) {
            setTimeout(updateCountdown, 100);
        } else {
            countdownElement.textContent = "00:00";
            localStorage.removeItem('endTime'); // Xóa bộ đếm khi hết giờ
            document.forms[0].action = '/Exam/SubmitQuizByTime';
            document.forms[0].submit();
        }
    }

    window.onload = startTimer;
</script>
</body>
</html>
