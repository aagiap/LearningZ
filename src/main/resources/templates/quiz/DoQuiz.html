<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <link href='https://use.fontawesome.com/releases/v5.7.2/css/all.css' rel='stylesheet'>
    <link rel="stylesheet" href="/css/DoQuiz.css">
</head>
<body>
<div>
    <div class="nav-header">
        <div class="left-section">
            <button class="menu-button">
                <i class="fas fa-tag"></i>
            </button>
            <h1 class="title" th:text="${quiz.getLesson().getTitle()}">
            </h1>
        </div>

        <div class="right-section">
            <div class="timer">
                <i class="far fa-clock"></i>
                <span id="countdown"></span>
            </div>
        </div>
    </div>
</div>
<form action="/Exam/CheckProgress" method="post">
    <div>
        <th:block th:each="question, questionStat : ${questionBankList}">
            <div class="container mt-sm-5 my-1">
                <span th:text="'Question ' + ${questionStat.index + 1}"></span>
                <div class="question ml-sm-5 pl-sm-5 pt-2">
                    <div class="py-2 h5"><b th:text="${question.getContent()}"></b></div>
                    <div class="pt-3" id="options">
                        <label class="options">
                            <span th:text="${question.getOption1()}"></span>
                            <input type="radio" th:name="'answers[' + ${questionStat.index} + '].selectedOption'"
                                   th:value="${question.getOption1()}">
                            <span class="checkmark"></span>
                        </label>
                        <label class="options">
                            <span th:text="${question.getOption2()}"></span>
                            <input type="radio" th:name="'answers[' + ${questionStat.index} + '].selectedOption'"
                                   th:value="${question.getOption2()}">
                            <span class="checkmark"></span>
                        </label>
                        <label class="options">
                            <span th:text="${question.getOption3()}"></span>
                            <input type="radio" th:name="'answers[' + ${questionStat.index} + '].selectedOption'"
                                   th:value="${question.getOption3()}">
                            <span class="checkmark"></span>
                        </label>
                        <label class="options">
                            <span th:text="${question.getOption4()}"></span>
                            <input type="radio" th:name="'answers[' + ${questionStat.index} + '].selectedOption'"
                                   th:value="${question.getOption4()}">
                            <span class="checkmark"></span>
                        </label>
                    </div>
                    <input type="hidden" th:name="'answers[' + ${questionStat.index} + '].questionId'"
                           th:value="${questionStat.index}">
                    <input type="hidden" th:name="'answers[' + ${questionStat.index} + '].correctAnswer'"
                           th:value="${question.getCorrectOption()}">
                </div>
            </div>
        </th:block>
    </div>
    <div class="d-flex justify-content-center align-items-center pt-3">
        <div class="d-flex ">
            <button class="btn btn-success">Submit</button>
        </div>
    </div>
</form>
<input type="hidden" id="timeLimitInput" th:value="${timeLimitSeconds}">



<script>
    let countdownElement = document.getElementById('countdown');
    let startTime, endTime;

    function startTimer() {
        let storedEndTime = localStorage.getItem('endTime');

        if (storedEndTime) {
            endTime = parseInt(storedEndTime);
        } else {
            let timeLimit = parseInt(document.getElementById('timeLimitInput').value) || 0;
            startTime = Date.now();
            endTime = startTime + timeLimit * 1000;
            localStorage.setItem('endTime', endTime);
        }

        updateCountdown();
    }

    function updateCountdown() {
        let now = Date.now();
        let timeLeft = Math.max(0, Math.floor((endTime - now) / 1000));

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        countdownElement.textContent =
            minutes.toString().padStart(2, '0') + ':' +
            seconds.toString().padStart(2, '0');

        if (timeLeft > 0) {
            setTimeout(updateCountdown, 100);
        } else {
            countdownElement.textContent = "00:00";
            localStorage.removeItem('endTime'); // Xóa bộ đếm khi hết giờ
            document.forms[0].action = '/Exam/SubmitQuizByTime';
            document.forms[0].submit();
        }
    }

    window.onload = startTimer;
</script>
</body>
</html>
