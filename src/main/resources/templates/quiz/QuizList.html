<!doctype html>
<html>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Snippet - BBBootstrap</title>
    <link href='https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css' rel='stylesheet'>
    <link href='https://use.fontawesome.com/releases/v5.7.2/css/all.css' rel='stylesheet'>
    <script type='text/javascript' src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script>
    <link rel="stylesheet" href="/css/QuizList.css">
</head>

<body className='snippet-body'>
<div class="container">
    <div id="content" class="my-5">
        <div id="filterbar">
            <div class="box border-bottom">
                <form method="get" th:action="@{/QuizList}" class="form-group text-center">
                    <button type="submit" class="btn btn-success">Apply</button>

                    <!-- Bộ lọc Subject -->
                    <div class="box border-bottom">
                        <div class="box-label text-uppercase d-flex align-items-center">Subject
                            <button class="btn ml-auto" type="button" data-target="#inner-box"
                                    aria-expanded="false" aria-controls="inner-box">
                                <span class="fas fa-plus"></span>
                            </button>
                        </div>
                        <div id="inner-box" class="mt-2 mr-1">
                            <div class="my-1" th:each="course : ${courses}">
                                <label class="tick">
                                    <span th:text="${course}"></span>
                                    <input type="radio" name="subject" th:value="${course}">
                                    <span class="check"> </span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Bộ lọc Grade -->
                    <div class="box border-bottom">
                        <div class="box-label text-uppercase d-flex align-items-center">Grade
                            <button class="btn ml-auto" type="button" data-toggle="collapse"
                                    data-target="#inner-box2" aria-expanded="false" aria-controls="inner-box2">
                                <span class="fas fa-plus"></span>
                            </button>
                        </div>
                        <div id="inner-box2" class="mt-2 mr-1">
                            <div class="my-1" th:each="grade : ${grades}">
                                <label class="tick">
                                    <span th:text="${grade}"></span>
                                    <input type="radio" name="grade" th:value="${grade}">
                                    <span class="check"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </form>

            </div>
        </div>
        <div id="products">
            <div class="row mx-0" th:each="quiz : ${quizzes}">
                <div class="col-lg-12">
                    <div class="test-item">
                        <a th:href="@{/Exam/StartQuiz(quizId=${quiz.getQuizId()})}" class="test-title">
                            <i class="fas fa-file-alt"></i>
                            <span th:text="${quiz.getTitle()}"></span>
                        </a>
                        <div class="test-info">
                            <span class="subject">
                                <i class="fas fa-tag"></i>
                                <span th:text="${quiz.getSubject()}"></span>
                            </span>
                            <span class="duration">
                                <i class="far fa-clock"></i>
                                <span th:text="${quiz.getTimeLimit() + ' minutes'} "></span>
                            </span>
                            <span class="total-questions">
                                <i class="fas fa-question-circle"></i>
                                <span th:text="${quiz.getTotalQuestions() + ' questions'} "></span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


</body>

</html>
