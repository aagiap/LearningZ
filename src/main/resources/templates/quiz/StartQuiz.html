<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <link href='https://use.fontawesome.com/releases/v5.7.2/css/all.css' rel='stylesheet'>
    <link rel="stylesheet" href="/css/DoQuiz.css">
</head>
<body>
<div class="container mt-sm-5 my-1">
    <div class="question ml-sm-5 pl-sm-5 pt-2">
        <div class="py-2 h5"><b th:text="${quiz.getTitle()}"></b></div>
        <div class="ml-md-3 ml-sm-3 pl-md-5 pt-sm-0 pt-3" id="options">
            <label class="options">
                <i class="fas fa-tag"></i>
                <span th:text="${quiz.getSubject()}"></span>
            </label>
            <label class="options">
                <i class="far fa-clock"></i>
                <span th:text="${quiz.getTimeLimit()+ ' minutes'} "></span>
            </label>
            <label class="options">
                <i class="fas fa-question-circle"></i>
                <span th:text="${quiz.getTotalQuestions()+ ' questions'}"></span>
            </label>
        </div>
    </div>
    <form method="get" action="/Exam/DoQuiz">
        <input type="hidden" name="quizId" th:value="${quiz.getQuizId()}">
        <div class="d-flex justify-content-center align-items-center pt-3">
            <div class="d-flex ">
                <button class="btn btn-success">Start</button>
            </div>
        </div>
    </form>
</div>
</body>
</html>
