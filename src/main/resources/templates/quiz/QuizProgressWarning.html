<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <link href='https://use.fontawesome.com/releases/v5.7.2/css/all.css' rel='stylesheet'>
    <link rel="stylesheet" href="/css/DoQuiz.css">
</head>
<body>
<div class="container mt-sm-5 my-1">
    <div class="question ml-sm-5 pl-sm-5 pt-2">
        <div class="py-2 h5"><b th:text="${warningTitle}" ></b></div>
        <div class="ml-md-3 ml-sm-3 pl-md-5 pt-sm-0 pt-3" id="options">
            <label class="options">
                <span th:text="${warningMessage}" style="color: red"></span>
            </label>
        </div>
    </div>

        <div class="d-flex align-items-center pt-3" style="justify-content: space-between;">
            <div id="prev">
                <button class="btn btn-primary" onclick="window.history.back();">Back</button>
            </div>
            <form method="post" action="/Exam/SubmitQuiz">
            <div class="ml-auto mr-sm-5">
                <button class="btn btn-success">Submit</button>
            </div>
            </form>
        </div>

</div>
</body>
</html>
