<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <link href='https://use.fontawesome.com/releases/v5.7.2/css/all.css' rel='stylesheet'>
    <link rel="stylesheet" href="/css/DoQuiz.css">
</head>
<body>
<div>
    <div class="nav-header">
        <div class="left-section">
            <button class="menu-button">
                <i class="fas fa-tag"></i>
            </button>
            <h1>Review quiz</h1>
            <h1 class="title" th:text="${session.quiz.getLesson().getTitle()}">
            </h1>
        </div>

        <div class="right-section">
            <div class="timer">
                <i class="far fa-clock"></i>
                <span th:text="${session.quiz.getTimeLimit() + 'minutes'}"></span>
            </div>
        </div>
    </div>
</div>
<div class="box-container" >
    <div class="box" th:each="result,resultQuestionsStat : ${resultQuestions}">
    <span th:classappend="${result=='True' ? 'text-success' : 'text-danger'}">
<span th:text="${#numbers.formatInteger(resultQuestionsStat.index + 1, 0)}"></span>
    </span>
    </div>
</div>
<form action="/Exam/SubmitQuiz" method="post">
    <div>
        <th:block th:each="question, questionStat : ${session.questionBankList}">
            <div class="container mt-sm-5 my-1">
                <span th:text="'Question ' + ${questionStat.index + 1}"></span>
                <span th:classappend="${resultQuestions.get(questionStat.index)=='True' ? 'text-success' : 'text-danger'}">
                <span th:text="${resultQuestions.get(questionStat.index)}"
                      style="    border-style: solid; border-radius: 5px;margin-left: 20px;"></span>
                </span>

                <div class="question ml-sm-5 pl-sm-5 pt-2">
                    <div class="py-2 h5"><b th:text="${question.getContent()}"></b></div>
                    <div class="pt-3" id="options">
                        <label class="options"
                               th:classappend="${question.getOption1() == quizSubmitionList.get(questionStat.index).getWrongSelection()} ? 'text-danger' : ''">
                            <input type="radio"
                                   th:name="'question_' + ${questionStat.index}"
                                   th:value="${question.getOption1()}"
                                   th:checked="${question.getOption1() == quizSubmitionList.get(questionStat.index).getSelectedOption()}"
                                   th:disabled="${question.getOption1() == quizSubmitionList.get(questionStat.index).getSelectedOption()}">
                            <span th:text="${question.getOption1()}"></span>
                            <span class="checkmark"></span>
                        </label>

                        <label class="options"
                               th:classappend="${question.getOption2() == quizSubmitionList.get(questionStat.index).getWrongSelection()} ? 'text-danger' : ''">
                            <input type="radio"
                                   th:name="'question_' + ${questionStat.index}"
                                   th:value="${question.getOption2()}"
                                   th:checked="${question.getOption2() == quizSubmitionList.get(questionStat.index).getSelectedOption()}"
                                   th:disabled="${question.getOption2() == quizSubmitionList.get(questionStat.index).getSelectedOption()}">
                            <span th:text="${question.getOption2()}"></span>
                            <span class="checkmark"></span>
                        </label>

                        <label class="options"
                               th:classappend="${question.getOption3() == quizSubmitionList.get(questionStat.index).getWrongSelection()} ? 'text-danger' : ''">
                            <input type="radio"
                                   th:name="'question_' + ${questionStat.index}"
                                   th:value="${question.getOption3()}"
                                   th:checked="${question.getOption3() == quizSubmitionList.get(questionStat.index).getSelectedOption()}"
                                   th:disabled="${question.getOption3() == quizSubmitionList.get(questionStat.index).getSelectedOption()}">
                            <span th:text="${question.getOption3()}"></span>
                            <span class="checkmark"></span>
                        </label>

                        <label class="options"
                               th:classappend="${question.getOption4() == quizSubmitionList.get(questionStat.index).getWrongSelection()} ? 'text-danger' : ''">
                            <input type="radio"
                                   th:name="'question_' + ${questionStat.index}"
                                   th:value="${question.getOption4()}"
                                   th:checked="${question.getOption4() == quizSubmitionList.get(questionStat.index).getSelectedOption()}"
                                   th:disabled="${question.getOption4() == quizSubmitionList.get(questionStat.index).getSelectedOption()}">
                            <span th:text="${question.getOption4()}"></span>
                            <span class="checkmark"></span>
                        </label>

                        <label class="options">
                            <span th:text="${'Correct option: '+ quizSubmitionList.get(questionStat.index).getCorrectAnswer()}"
                                  style="color: green"></span>
                        </label>
                    </div>
                </div>
            </div>
        </th:block>
    </div>
    <div class="d-flex justify-content-center align-items-center pt-3">
        <div class="d-flex ">
            <button class="btn btn-success">Start</button>
        </div>
    </div>
</form>


</body>
</html>
