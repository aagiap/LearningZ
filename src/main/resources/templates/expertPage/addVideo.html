<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add new video</title>
    <link rel="stylesheet" th:href="@{/css/addVideoStyle.css}">
</head>
<body>

<div class="container">
    <h2>Add new video</h2>

    <form action="/expert/chapter/lesson/videos/addVideo/create" method="post" enctype="multipart/form-data">
        <input type="hidden" name="lessonId" th:value="${lessonId}">

        <label>Title:</label>
        <input type="text" name="videoTitle" required>

        <label>VideoURL</label>
        <input type="file" name="videoUrl" id="videoFile" accept="video/*">

        <div class="btn-group">
            <button type="submit" class="create-btn">Create</button>
            <button type="button" class="cancel-btn" onclick="closeEditForm()">Cancel</button>
        </div>
    </form>
    <div class="video-container">
        <video id="videoPreview" width="750" controls style="display: none;"></video>
    </div>
    <!-- Hiển thị lỗi -->
    <div th:if="${error}" class="error-messages">
        <p th:text="${error}">
    </div>
    <!-- Hiển thị thông báo thành công -->
    <div th:if="${notification}" class="success-message">
        <p th:text="${notification}"></p>
    </div>

    <form action="/expert/chapter/lesson/videos" method="get" id="returnVideoList">
        <input type="number" name="lessonId" th:value="${lessonId}" hidden>
    </form>
</div>
<script>
    function closeEditForm() {
        document.querySelector('#returnVideoList').submit();
    }
    document.getElementById("videoFile").addEventListener("change", function(event) {
        const file = event.target.files[0];
        if (file) {
            const videoPreview = document.getElementById("videoPreview");
            const videoURL = URL.createObjectURL(file);
            videoPreview.src = videoURL;
            videoPreview.style.display = "block";
        }
    });
</script>

</body>
</html>
