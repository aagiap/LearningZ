<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Widget</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body th:fragment="chat">
<div id="chat-widget" class="chat-widget"
     th:classappend="${question != null or answer != null or message != null} ? '' : 'collapsed'">
    <!-- Header -->
    <div class="chat-header">
        <div class="chat-title">LearningZ Ai Assistant</div>
        <button class="toggle-button" id="minimize-button">
            <i class="fas fa-minus"></i>
        </button>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chat-messages">
        <div class="message user" th:if="${question}">
            <div th:text="${question}"></div>
        </div>
        <div class="message ai" th:if="${message}">
            <div th:text="${message}"></div>
        </div>
        <div class="message ai" th:if="${answer}">
            <div th:text="${answer}"></div>
            <div class="feedback">
                <form action="/api/feedback" method="post">
                    <button class="feedback-button" type="submit">
                        <i class="fas fa-thumbs-up"></i>
                    </button>
                    <input type="hidden" name="userQuestion" th:value="${question}">
                    <input type="hidden" name="aiAnswer" th:value="${answer}">
                    <input type="hidden" name="aiReact" value="DISLIKE">
                </form>
                <form action="/api/feedback" method="post">
                    <button class="feedback-button" type="submit">
                        <i class="fas fa-thumbs-down"></i>
                    </button>
                    <input type="hidden" name="userQuestion" th:value="${question}">
                    <input type="hidden" name="aiAnswer" th:value="${answer}">
                    <input type="hidden" name="aiReact" value="LIKE">
                </form>
            </div>

        </div>
    </div>

    <!-- Input area -->
    <form id="chat-form" class="chat-input" action="/api/ask" method="post" enctype="multipart/form-data">
        <div class="image-preview" id="image-preview">
            <img id="preview-img" src="/placeholder.svg" alt="Preview">
            <button type="button" class="remove-image" id="remove-image">×</button>
        </div>
        <div class="input-container">
            <button type="button" class="file-button" id="file-button">
                <i class="fas fa-image"></i>
            </button>
            <input type="file" id="image" name="image" accept="image/*" style="display: none;">
            <input type="text" id="question" name="question" class="text-input" placeholder="Ask a question..."
                   required>
            <button type="submit" class="send-button">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </form>

    <!-- Collapsed chat button -->
    <button class="chat-button" id="expand-button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </button>
</div>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        // Elements
        const chatWidget = document.getElementById('chat-widget');
        const minimizeButton = document.getElementById('minimize-button');
        const expandButton = document.getElementById('expand-button');
        const fileButton = document.getElementById('file-button');
        const fileInput = document.getElementById('image');
        const imagePreview = document.getElementById('image-preview');
        const previewImg = document.getElementById('preview-img');
        const removeImageButton = document.getElementById('remove-image');

        // Toggle chat widget
        minimizeButton.addEventListener('click', function () {
            chatWidget.classList.add('collapsed');
        });

        expandButton.addEventListener('click', function () {
            chatWidget.classList.remove('collapsed');
        });

        // File input handling
        fileButton.addEventListener('click', function () {
            fileInput.click();
        });

        fileInput.addEventListener('change', function () {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImg.src = e.target.result;
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        removeImageButton.addEventListener('click', function () {
            fileInput.value = '';
            imagePreview.style.display = 'none';
        });

        // Paste image from clipboard
        document.addEventListener('paste', function (event) {
            const items = (event.clipboardData || event.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') === 0) {
                    const file = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        previewImg.src = e.target.result;
                        imagePreview.style.display = 'block';

                        // Create a DataTransfer object and add the file
                        const dataTransfer = new DataTransfer();
                        dataTransfer.items.add(file);
                        fileInput.files = dataTransfer.files;
                    };
                    reader.readAsDataURL(file);
                    break;
                }
            }
        });
    });
</script>
<style>
    /* Reset and base styles */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #f5f5f5;
    }

    /* Chat widget container */
    .chat-widget {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 320px;
        height: 400px;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: all 0.3s ease;
        z-index: 1000;
    }

    /* Collapsed state */
    .chat-widget.collapsed {
        width: 60px;
        height: 60px;
        border-radius: 50%;
    }

    /* Chat header */
    .chat-header {
        background-color: #0a7c42;
        color: white;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chat-title {
        font-size: 16px;
        font-weight: 500;
    }

    .toggle-button {
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
    }

    .toggle-button:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }

    /* Chat messages container */
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* Message bubbles */
    .message {
        max-width: 80%;
        padding: 10px 12px;
        border-radius: 12px;
        position: relative;
    }

    .message.user {
        align-self: flex-end;
        background-color: #0a7c42;
        color: white;
    }

    .message.ai {
        align-self: flex-start;
        background-color: #f0f0f0;
        color: #333;
    }

    /* Message with image */
    .message-image {
        max-width: 100%;
        border-radius: 8px;
        margin-top: 8px;
    }

    /* Feedback buttons */
    .feedback {
        display: flex;
        gap: 8px;
        margin-top: 4px;
    }

    .feedback-button {
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .feedback-button:hover {
        background-color: #f0f0f0;
    }

    .feedback-button.active.positive {
        color: #0a7c42;
        background-color: rgba(10, 124, 66, 0.1);
    }

    .feedback-button.active.negative {
        color: #e53935;
        background-color: rgba(229, 57, 53, 0.1);
    }

    /* Chat input area */
    .chat-input {
        padding: 12px;
        border-top: 1px solid #eee;
    }

    .image-preview {
        position: relative;
        width: 60px;
        height: 60px;
        margin-bottom: 8px;
        display: none;
    }

    .image-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
    }

    .remove-image {
        position: absolute;
        top: -8px;
        right: -8px;
        background-color: #e53935;
        color: white;
        border: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 12px;
    }

    .input-container {
        display: flex;
        gap: 8px;
    }

    .file-button {
        background-color: #f0f0f0;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    .file-button:hover {
        background-color: #e0e0e0;
    }

    .text-input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 20px;
        outline: none;
    }

    .text-input:focus {
        border-color: #0a7c42;
    }

    .send-button {
        background-color: #0a7c42;
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    .send-button:hover {
        background-color: #086535;
    }

    /* Collapsed chat button */
    .chat-button {
        width: 100%;
        height: 100%;
        background-color: #0a7c42;
        color: white;
        border: none;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    /* Hide elements when collapsed */
    .chat-widget.collapsed .chat-header,
    .chat-widget.collapsed .chat-messages,
    .chat-widget.collapsed .chat-input {
        display: none;
    }

    .chat-widget:not(.collapsed) .chat-button {
        display: none;
    }

    /* SVG icons */
    .icon {
        width: 20px;
        height: 20px;
    }

    .message.user {
        align-self: flex-end;
        background-color: #0a7c42;
        color: white;
    }
</style>
</body>
</html>
