<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Widget</title>


</head>
<body th:fragment="chat">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<div id="chat-widget" class="collapsed chat-widget">
    <!-- Header -->
    <div class="chat-header">
        <div class="chat-title">LearningZ AI Assistant</div>

            <button class="clear-chat" id="clear-chat" title="Clear chat history" style="margin-left: auto">
                <i class="fas fa-trash-alt"></i>
            </button>
            <button class="toggle-button" id="minimize-button">
                <i class="fas fa-minus"></i>
            </button>

    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chat-messages" th:fragment="chat-content">
        <div class="message ai">
            <div>Hello! How can I help you today?</div>
            <div class="feedback">
                <button class="feedback-button" onclick="provideFeedback(this, 'positive')">
                    <i class="fas fa-thumbs-up"></i>
                </button>
                <button class="feedback-button" onclick="provideFeedback(this, 'negative')">
                    <i class="fas fa-thumbs-down"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Input area -->
    <form id="chat-form" class="chat-input">
        <div class="image-preview" id="image-preview">
            <button type="button" class="remove-image" id="remove-image">×</button>
        </div>
        <div class="input-container">
            <button type="button" class="file-button" id="file-button">
                <i class="fas fa-image"></i>
            </button>
            <input type="file" id="image" name="image" accept="image/*" style="display: none;">
            <input type="text" id="question" name="question" class="text-input" placeholder="Ask a question..." required>
            <button type="button" id="send-button" class="send-button">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </form>

    <!-- Collapsed chat button -->
    <button class="chat-button" id="expand-button">
        <i class="fas fa-comment"></i>
    </button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Elements
        const chatWidget = document.getElementById('chat-widget');
        const minimizeButton = document.getElementById('minimize-button');
        const expandButton = document.getElementById('expand-button');
        const fileButton = document.getElementById('file-button');
        const fileInput = document.getElementById('image');
        const imagePreview = document.getElementById('image-preview');
        const previewImg = document.getElementById('preview-img');
        const removeImageButton = document.getElementById('remove-image');
        const chatForm = document.getElementById('chat-form');
        const questionInput = document.getElementById('question');
        const sendButton = document.getElementById('send-button');
        const chatMessages = document.getElementById('chat-messages');
        const clearChatButton = document.getElementById('clear-chat');

        // Chat history array - stores the conversation
        let chatHistory = [];

        // Initialize with welcome message if no history exists
        if (chatHistory.length === 0) {
            chatHistory.push({
                role: "ai",
                content: "Hello! How can I help you today?"
            });
        }

        // Load chat history from localStorage if available
        function loadChatHistory() {
            const savedHistory = localStorage.getItem('chatHistory');
            if (savedHistory) {
                try {
                    chatHistory = JSON.parse(savedHistory);
                    renderChatHistory();
                } catch (e) {
                    console.error('Error loading chat history:', e);
                    chatHistory = [{
                        role: "ai",
                        content: "Hello! How can I help you today?"
                    }];
                    renderChatHistory();
                }
            }
        }

        // Save chat history to localStorage
        function saveChatHistory() {
            localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
        }

        // Convert URLs in text to clickable links
        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
            });
        }

        // Render the chat history in the UI
        function renderChatHistory() {
            chatMessages.innerHTML = '';

            chatHistory.forEach(message => {
                const messageElement = document.createElement('div');
                messageElement.className = `message ${message.role === 'user' ? 'user' : 'ai'}`;

                // Create message content with linkified text
                const contentElement = document.createElement('div');
                contentElement.innerHTML = linkify(message.content);
                messageElement.appendChild(contentElement);

                // Add image if present
                if (message.image) {
                    const imgElement = document.createElement('img');
                    imgElement.className = 'message-image';
                    imgElement.src = message.image;
                    messageElement.appendChild(imgElement);
                }

                // Add feedback buttons for AI messages
                if (message.role === 'ai') {
                    const feedbackDiv = document.createElement('div');
                    feedbackDiv.className = 'feedback';

                    const positiveButton = document.createElement('button');
                    positiveButton.className = 'feedback-button' + (message.feedback === 'positive' ? ' active positive' : '');
                    positiveButton.innerHTML = '<i class="fas fa-thumbs-up"></i>';
                    positiveButton.onclick = function() { provideFeedback(this, 'positive'); };

                    const negativeButton = document.createElement('button');
                    negativeButton.className = 'feedback-button' + (message.feedback === 'negative' ? ' active negative' : '');
                    negativeButton.innerHTML = '<i class="fas fa-thumbs-down"></i>';
                    negativeButton.onclick = function() { provideFeedback(this, 'negative'); };

                    feedbackDiv.appendChild(positiveButton);
                    feedbackDiv.appendChild(negativeButton);
                    messageElement.appendChild(feedbackDiv);
                }

                chatMessages.appendChild(messageElement);
            });

            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Clear chat history
        clearChatButton.addEventListener('click', function() {
            if (confirm('Are you sure you want to clear the chat history?')) {
                chatHistory = [{
                    role: "ai",
                    content: "Hello! How can I help you today?"
                }];
                saveChatHistory();
                renderChatHistory();
            }
        });

        // Clear chat history when reload
        window.onload = function() {
            chatHistory = [{
                role: "ai",
                content: "Hello! How can I help you today?"
            }];
            saveChatHistory();
            renderChatHistory();
        };


        // Toggle chat widget
        minimizeButton.addEventListener('click', function() {
            chatWidget.classList.add('collapsed');
        });

        expandButton.addEventListener('click', function() {
            chatWidget.classList.remove('collapsed');
            // Scroll to bottom when expanding
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        // File input handling
        fileButton.addEventListener('click', function() {
            fileInput.click();
        });

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        removeImageButton.addEventListener('click', function() {
            fileInput.value = '';
            imagePreview.style.display = 'none';
        });

        // Paste image from clipboard
        document.addEventListener('paste', function(event) {
            const items = (event.clipboardData || event.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') === 0) {
                    const file = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        previewImg.src = e.target.result;
                        imagePreview.style.display = 'block';

                        // Create a DataTransfer object and add the file
                        const dataTransfer = new DataTransfer();
                        dataTransfer.items.add(file);
                        fileInput.files = dataTransfer.files;
                    };
                    reader.readAsDataURL(file);
                    break;
                }
            }
        });

        // Feedback functionality
        window.provideFeedback = function(button, type) {
            // Find the message container
            const messageContainer = button.closest('.message');
            if (!messageContainer) return;

            // Find all feedback buttons in this message
            const feedbackButtons = messageContainer.querySelectorAll('.feedback-button');

            // Remove active class from all buttons
            feedbackButtons.forEach(btn => {
                btn.classList.remove('active', 'positive', 'negative');
            });

            // Add active class to clicked button
            if (type === 'positive') {
                button.classList.add('active', 'positive');
            } else {
                button.classList.add('active', 'negative');
            }

            // Find the message in chat history and update feedback
            const messageIndex = Array.from(chatMessages.children).indexOf(messageContainer);
            if (messageIndex >= 0 && messageIndex < chatHistory.length) {
                chatHistory[messageIndex].feedback = type;
                saveChatHistory();
            }
        };

        // Handle sending messages
        function sendMessage() {
            const question = questionInput.value.trim();
            if (!question) return;

            let imageData = null;

            // Get image data if present
            if (fileInput.files.length > 0) {
                imageData = previewImg.src;
            }

            // Add user message to chat history
            chatHistory.push({
                role: 'user',
                content: question,
                image: imageData
            });

            // Update UI
            renderChatHistory();

            // Add thinking indicator
            const aiMessageElement = document.createElement('div');
            aiMessageElement.className = 'message ai thinking';

            const thinkingIndicator = document.createElement('div');
            thinkingIndicator.className = 'thinking-indicator';
            thinkingIndicator.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

            aiMessageElement.appendChild(thinkingIndicator);
            chatMessages.appendChild(aiMessageElement);

            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Prepare data for sending - include the entire chat history
            const jsonData = {
                question: question,
                chatHistory: chatHistory.map(msg => ({
                    role: msg.role,
                    content: msg.content
                }))
            };

            // Send request to server
            fetch('/api/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(jsonData)
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(data => {
                    // Remove thinking indicator
                    chatMessages.removeChild(aiMessageElement);

                    // Add AI response to chat history
                    chatHistory.push({
                        role: 'ai',
                        content: data,
                        feedback: null
                    });

                    // Save and render updated chat history
                    saveChatHistory();
                    renderChatHistory();
                })
                .catch(error => {
                    console.error('Error:', error);

                    // Remove thinking indicator
                    chatMessages.removeChild(aiMessageElement);

                    // Add error message to chat history
                    chatHistory.push({
                        role: 'ai',
                        content: 'Sorry, there was an error processing your request.',
                        feedback: null
                    });

                    // Save and render updated chat history
                    saveChatHistory();
                    renderChatHistory();
                })
                .finally(() => {
                    // Clear input and image preview
                    questionInput.value = '';
                    fileInput.value = '';
                    imagePreview.style.display = 'none';
                });
        }

        // Event listeners for sending messages
        sendButton.addEventListener('click', sendMessage);

        questionInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Prevent form submission (we handle it via JavaScript)
        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
        });

        // Load chat history on page load
        loadChatHistory();
    });
</script>
<style>
    /* Reset and base styles */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #f5f5f5;
    }

    /* Chat widget container */
    .chat-widget {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 320px;
        height: 400px;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: all 0.3s ease;
        z-index: 1000;
    }

    /* Collapsed state */
    .chat-widget.collapsed {
        width: 60px;
        height: 60px;
        border-radius: 50%;
    }

    /* Chat header */
    .chat-header {
        background-color: #1C3B5C;
        color: white;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chat-title {
        font-size: 16px;
        font-weight: 500;
    }

    .toggle-button {
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
    }

    .toggle-button:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }

    /* Chat messages container */
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* Message bubbles */
    .message {
        max-width: 80%;
        padding: 10px 12px;
        border-radius: 12px;
        position: relative;
    }

    .message.user {
        align-self: flex-end;
        background-color: #1C3B5C;
        color: white;
    }

    .message.ai {
        align-self: flex-start;
        background-color: #f0f0f0;
        color: #333;
    }

    /* Message with image */
    .message-image {
        max-width: 100%;
        border-radius: 8px;
        margin-top: 8px;
    }

    /* Links in messages */
    .message a {
        color: inherit;
        text-decoration: underline;
        word-break: break-all;
    }
    .message a:hover{
        color: #1C3B5C;
    }

    /* Feedback buttons */
    .feedback {
        display: flex;
        gap: 8px;
        margin-top: 4px;
    }

    .feedback-button {
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .feedback-button:hover {
        background-color: #f0f0f0;
    }

    .feedback-button.active.positive {
        color: #1C3B5C;
        background-color: rgba(10, 124, 66, 0.1);
    }

    .feedback-button.active.negative {
        color: #e53935;
        background-color: rgba(229, 57, 53, 0.1);
    }

    /* Chat input area */
    .chat-input {
        padding: 12px;
        border-top: 1px solid #eee;
    }

    .image-preview {
        position: relative;
        width: 60px;
        height: 60px;
        margin-bottom: 8px;
        display: none;
    }

    .image-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
    }

    .remove-image {
        position: absolute;
        top: -8px;
        right: -8px;
        background-color: #e53935;
        color: white;
        border: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 12px;
    }

    .input-container {
        display: flex;
        gap: 8px;
    }

    .file-button {
        background-color: #f0f0f0;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    .file-button:hover {
        background-color: #e0e0e0;
    }

    .text-input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 20px;
        outline: none;
    }

    .text-input:focus {
        border-color: #1C3B5C;
    }

    .send-button {
        background-color: #1C3B5C;
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    .send-button:hover {
        background-color: #07294D;
    }

    /* Collapsed chat button */
    .chat-button {
        width: 100%;
        height: 100%;
        background-color: #1C3B5C;
        color: white;
        border: none;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    /* Hide elements when collapsed */
    .chat-widget.collapsed .chat-header,
    .chat-widget.collapsed .chat-messages,
    .chat-widget.collapsed .chat-input {
        display: none;
    }

    .chat-widget:not(.collapsed) .chat-button {
        display: none;
    }

    /* Thinking indicator */
    .thinking-indicator {
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: center;
        padding: 8px 0;
    }

    .thinking-indicator .dot {
        width: 8px;
        height: 8px;
        background-color: #666;
        border-radius: 50%;
        animation: pulse 1.5s infinite ease-in-out;
    }

    .thinking-indicator .dot:nth-child(2) {
        animation-delay: 0.2s;
    }

    .thinking-indicator .dot:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(0.8);
            opacity: 0.6;
        }
        50% {
            transform: scale(1.2);
            opacity: 1;
        }
    }

    /* Attachment preview */
    .attachment {
        max-width: 200px;
        max-height: 150px;
        border-radius: 8px;
        margin-top: 8px;
        display: block;
    }

    /* Clear chat button */
    .clear-chat {
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        font-size: 14px;
        padding: 4px 8px;
        border-radius: 4px;
    }

    .clear-chat:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }
</style>
</body>
</html>
