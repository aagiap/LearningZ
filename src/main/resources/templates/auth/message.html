<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background-image: linear-gradient(to right, #07294D 0%, #FFFFFF 100%);
            font-family: Arial, sans-serif;
        }

        .top-nav {
            background-color: #2196f3; /* Xanh đậm */
            color: white;
            padding: 15px 0;
        }

        .top-nav h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .message-section {
            margin-top: 50px;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .message-section h2 {
            color: #0d47a1; /* Xanh đậm hơn */
            font-weight: bold;
        }

        .message-section h4 {
            color: #1976d2; /* Xanh trung bình */
        }

        .footer {
            background-color: #bbdefb; /* Xanh nhạt */
            color: #0d47a1;
            padding: 15px 0;
            margin-top: 50px;
        }

    </style>
</head>
<body>
<div class="container-fluid">

    <!-- Message Section -->
    <div class="message-section text-center mx-auto" style="max-width: 600px;">
        <h2 th:text="${title}">Default Title</h2>
        <h4 th:text="${message}">Default Message</h4>
        <a th:href="@{/login}">Login here</a>
    </div>



</div>
</body>
</html>
