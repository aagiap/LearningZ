
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background-color: #f0f8ff; /* Màu xanh dương nhạt (Alice Blue) */
            font-family: 'Arial', sans-serif;
        }

        h2 {
            color: #4682b4; /* Xanh dương trung bình */
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }

        form {
            background-color: #ffffff; /* Nền trắng cho form */
            border: 2px solid #add8e6; /* Xanh dương nhạt (Light Blue) */
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 255, 0.1); /* Hiệu ứng bóng xanh */
            padding: 20px;
            margin-top: 30px;
        }

        input[type="password"] {
            border: 2px solid #87ceeb; /* Xanh da trời nhạt */
            border-radius: 5px;
            padding: 10px;
            font-size: 1rem;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #00bfff; /* Xanh da trời sáng khi focus */
            box-shadow: 0px 0px 5px rgba(0, 191, 255, 0.5); /* Hiệu ứng sáng xanh */
        }

        .btn-primary {
            background-color: #5dade2; /* Xanh dương nhạt */
            border: none;
            font-size: 1rem;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .btn-primary:hover {
            background-color: #4682b4; /* Xanh dương trung bình khi hover */
        }

        .container {
            max-width: 350px;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
    <script>
        function checkPasswordMatch(fieldConfirmPassword) {
            const passwordField = document.getElementById("password");
            if (fieldConfirmPassword.value !== passwordField.value) {
                fieldConfirmPassword.setCustomValidity("Passwords do not match!");
            } else {
                fieldConfirmPassword.setCustomValidity("");
            }
        }
    </script>
</head>
<body>
<div class="container">
    <!-- Tiêu đề -->
    <h2>Reset Your Password</h2>

    <!-- Form -->
    <form th:action="@{/reset_password}" method="post">
        <input type="hidden" name="token" th:value="${token}"/>
        <div>
            <p>
                <input type="password" name="password" id="password" class="form-control"
                       placeholder="Enter your new password" required autofocus/>
            </p>
            <p>
                <input type="password" class="form-control" placeholder="Confirm your new password"
                       required oninput="checkPasswordMatch(this);"/>
            </p>
            <p class="text-center">
                <input type="submit" value="Change Password" class="btn btn-primary"/>
            </p>
        </div>
    </form>
</div>
</body>
</html>
