<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Verify</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/StyleRegister.css">
</head>
<body>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.2.0/css/material-design-iconic-font.min.css"
      integrity="sha256-3sPp8BkKUE7QyPSl6VfBByBroQbKxKG7tsusY2mhbVY=" crossorigin="anonymous"/>
<div class="container">
    <div class="row">
        <div class="col-md-11 mt-60 mx-md-auto">
            <div class="login-box bg-white pl-lg-5 pl-0">
                <div class="row no-gutters align-items-center">
                    <div class="col-md-6">
                        <div class="form-wrap bg-white">
                            <h4 class="btm-sep pb-3 mb-5">Enter verification code</h4>
                            <p th:if="${message}" th:text="${message}" style="color: red";> </p>
                            <form class="form" method="post" action="/verify">
                                <div class="row">
                                    <div class="col-12" id="verification">
                                        <div class="form-group position-relative">
                                            <input type="text" name="code" class="form-control" required
                                                   style="width: 80%;margin-left: 5%">
                                        </div>
                                    </div>
                                    <div class="col-12 mt-30">
                                        <button type="button" class="btn btn-lg btn-custom btn-dark btn-block" style="width: auto;margin-bottom: 12px;color: black; background: white;border: none;"
                                                onclick="resendCode()">Resend Code
                                        </button>
                                    </div>
                                    <div class="col-12 mt-30">
                                        <button type="submit" class="btn btn-lg btn-custom btn-dark btn-block">Submit
                                        </button>
                                    </div>
                                </div>

                            </form>


                            <script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
                            <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.bundle.min.js"></script>
                            <script>
                                function resendCode() {
                                    $.get("/resend", function (data) {
                                        alert("A new verification code has been sent to your email.");
                                    });
                                }
                            </script>

                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="content text-center">
                            <div class="border-bottom pb-5 mb-5">
                            </div>
                            <div class="socials">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
