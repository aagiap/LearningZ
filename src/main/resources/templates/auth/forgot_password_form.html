
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="/css/StyleRegister.css">
<style>
        .text-warning {
            color: #ffa500;
            font-size: 1.2rem;
            text-align: center;
            font-weight: bolder;
        }

        .text-danger {
            color: #ff6f61;
            font-size: 1.2rem;
            text-align: center;
            font-weight: bolder;
        }
    </style>
</head>
<body>

<div class="message-container">
    <div th:if="${error != null}">
        <p class="text-danger">[[${error}]]</p>
    </div>
    <div th:if="${message != null}">
        <p class="text-warning">[[${message}]]</p>
    </div>
</div>
<form class="container space-y-4"  th:action="@{/forgot_password}" method="post" style="max-width: 420px; margin: 0 auto; border-radius: 12px!important; ">
    <div class="p-3" style="background-color: white; border-radius: 10px" >
        <h2 style="text-align: center">Forgot Password</h2>
        <div>
            <p>We will be sending a reset password link to your email.</p>
        </div>
        <div>
            <div class="form-icon absolute inset-y-0 left-0 w-12 flex items-center justify-center rounded-l-md">
                <i class="zmdi zmdi-account text-white text-xl"></i>
            </div>
            <p>
                <input type="email" name="email" class="form-control" placeholder="Enter your e-mail" required
                       autofocus/>
            </p>
            <p class="text-center">
                <input style="background-color: #1f2937 " type="submit" value="Send" class="btn btn-primary"/>
            </p>
        </div>
    </div>
</form>
</body>
</html>
