<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background-color: #e6f7ff; /* Xanh xương nhạt */
            font-family: 'Arial', sans-serif;
            color: #333333; /* Màu chữ tối dịu */
        }

        h2 {
            color: #4682b4; /* Xanh dương trung bình */
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        form {
            background-color: #ffffff; /* Nền trắng cho form */
            border: 1px solid #b0d6e8; /* Viền xanh xương nhạt */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 255, 0.1); /* Bóng nhẹ màu xanh */
            margin-top: 30px;
        }

        input[type="email"] {
            border: 2px solid #b0d6e8; /* Viền xanh xương nhạt */
            border-radius: 5px;
            padding: 10px;
            font-size: 1rem;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #87ceeb; /* Xanh da trời nhạt khi focus */
            box-shadow: 0px 0px 5px rgba(135, 206, 235, 0.5);
        }

        .btn-primary {
            background-color: #5dade2; /* Xanh dương nhạt */
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background-color: #4682b4; /* Xanh dương trung bình khi hover */
        }

        .message-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .text-warning {
            color: #ffa500; /* Vàng cam nhạt */
            font-size: 1.2rem;
        }

        .text-danger {
            color: #ff6f61; /* Màu đỏ nhạt dịu */
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
<div>
    <h2>Forgot Password</h2>
</div>
<div class="message-container">
    <div th:if="${error != null}">
        <p class="text-danger">[[${error}]]</p>
    </div>
    <div th:if="${message != null}">
        <p class="text-warning">[[${message}]]</p>
    </div>
</div>
<form th:action="@{/forgot_password}" method="post" style="max-width: 420px; margin: 0 auto;">
    <div class="border border-secondary rounded p-3">
        <div>
            <p>We will be sending a reset password link to your email.</p>
        </div>
        <div>
            <p>
                <input type="email" name="email" class="form-control" placeholder="Enter your e-mail" required autofocus/>
            </p>
            <p class="text-center">
                <input type="submit" value="Send" class="btn btn-primary" />
            </p>
        </div>
    </div>
</form>
</body>
</html>
