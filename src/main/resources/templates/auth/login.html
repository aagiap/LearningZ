<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.2.0/css/material-design-iconic-font.min.css">
    <style>
        body {
            background-image: linear-gradient(to right, #5370D9 0%, #FFFFFF 100%);
        }
        .login-box {
            box-shadow: 0 10px 20px 0 rgba(0, 0, 0, 0.1);
        }
        .form-icon {
            background-color: #4e63d7;
        }
        .social-btn {
            background-color: #6893e1;
            transition: background-color 0.3s ease;
        }
        .social-btn:hover {
            background-color: #5370D9;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="login-box bg-white w-full max-w-4xl rounded-lg overflow-hidden">
    <div class="md:flex">
        <!-- Login Form Section -->
        <div class="p-6 md:p-8 lg:p-12 md:w-1/2">
            <h4 class="text-2xl font-semibold border-b pb-3 mb-6">Login</h4>
            <form action="/login" method="post" class="space-y-4">
                <div class="relative">
                    <div class="form-icon absolute inset-y-0 left-0 w-12 flex items-center justify-center rounded-l-md">
                        <i class="zmdi zmdi-account text-white text-xl"></i>
                    </div>
                    <input type="text" name="username" placeholder="Username" required
                           class="pl-14 h-12 rounded-md w-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="relative">
                    <div class="form-icon absolute inset-y-0 left-0 w-12 flex items-center justify-center rounded-l-md">
                        <i class="zmdi zmdi-lock text-white text-xl"></i>
                    </div>
                    <input type="password" name="password" placeholder="Password" required
                           class="pl-14 h-12 rounded-md w-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="text-right">
                    <a href="#" class="text-sm text-gray-600 hover:text-blue-500">Forgot password?</a>
                </div>
                <button type="submit" class="w-full h-12 bg-gray-900 text-white rounded-md hover:bg-gray-800 transition-colors">
                    Sign In
                </button>
            </form>
        </div>

        <!-- Sign Up Section -->
        <div class="bg-gray-50 p-6 md:p-8 lg:p-12 md:w-1/2 flex flex-col items-center justify-center space-y-6">
            <div class="text-center pb-6 border-b w-full space-y-4">
                <h3 class="text-2xl font-semibold">First time here?</h3>
                <a href="/register" class="inline-block px-6 py-2 border-2 border-blue-500 text-blue-500 rounded-md hover:bg-blue-500 hover:text-white transition-colors">
                    Sign up
                </a>
            </div>
            <div class="text-center space-y-4">
                <h5 class="text-lg font-medium">Or Sign In With</h5>
                <div class="flex gap-3 justify-center">
                    <a href="#" class="social-btn w-12 h-12 rounded flex items-center justify-center text-white">
                        <i class="zmdi zmdi-facebook text-xl"></i>
                    </a>
                    <a href="#" class="social-btn w-12 h-12 rounded flex items-center justify-center text-white">
                        <i class="zmdi zmdi-twitter text-xl"></i>
                    </a>
                    <a href="#" class="social-btn w-12 h-12 rounded flex items-center justify-center text-white">
                        <i class="zmdi zmdi-google text-xl"></i>
                    </a>
                    <a href="#" class="social-btn w-12 h-12 rounded flex items-center justify-center text-white">
                        <i class="zmdi zmdi-instagram text-xl"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
