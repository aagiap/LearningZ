<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course List</title>
    <link rel="stylesheet" th:href="@{/css/courseListTeacherStyle.css}">
    <!-- Thư viện jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
</head>

<body>
<div class="expertNavigation">
    <div class="logo-container">
        <a href="/home">
            <img src="/image/learningz.png" alt="Logo">
        </a>
        <span class="logo-text">Learning<span class="highlight">Z</span></span>
        <div id="overlay" class="overlay" onclick="closeSidebar()"></div>

        <div id="sidebar" class="sidebar">
            <button onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
            <br>
            <ul>
                <li>
                    <a href="#" onclick="viewDashBoard(this)">📊 Dashboard</a>
                    <form action="/teacher/dashboard" id="viewDashboard">
                        <input type="hidden" name="userId" th:value="${user.getId()}">
                    </form>
                </li>
                <li><a href="/teacher">📚 Courses Management</a></li>
                <li>
                    <a href="#" onclick="viewSubjectList(this)">📖 Subjects List</a>
                    <form action="/teacher/subject" id="viewSubjectList">
                        <input type="number" name="userId" th:value="${user.getId()}" hidden>
                    </form>
                </li>
                <li><a href="/teacher/questionList">❓ Question List</a></li>
            </ul>
        </div>

        <button id="openSidebarBtn" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></button>
    </div>
    <div class="rightNav">
        <div class="expertAvatar">
            <button>
                <img th:src="${user.getAvtUrl()}" alt="Avatar">
            </button>
            <ul class="dropdownMenu">
                <li><a href="/home/profile">Profile</a></li>
                <li><a href="/home/change_password">Change password</a></li>
                <li><a href="/logout">Log out</a></li>
            </ul>
        </div>
        <label>Teacher:</label>
        <p th:text="${user.getUsername()}"></p>
    </div>
</div>
<div class="container">
    <h2>Course List</h2>

    <div class="filter-section">
        <form action="/teacher/search">
            <input name="courseSearchKey" type="text" id="searchInput" placeholder="Search course by name">
            <select id="subjectFilter" name="subjectId">
                <option value="0">All Subjects</option>
                <option th:each="subject : ${subjectList}" th:value="${subject.getId()}" th:text="${subject.getName()}"></option>
            </select>
            <select name="gradeId" id="gradeFilter">
                <option value="0">All Grade</option>
                <option th:each="grade : ${gradeList}" th:value="${grade.getId()}" th:text="${grade.getName()}"></option>
            </select>
            <input type="submit" value="Search">
        </form>

        <form action="/teacher/add_course" method="get">
            <input type="number" name="userId" th:value="${user.getId()}" hidden>
            <button type="submit">+ Add New Course</button>
        </form>

    </div>

    <table th:if="${notification}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Subject</th>
            <th>Grade</th>
            <th>Chapters</th>
            <th>Lessons</th>
            <th>Status</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td th:text="${notification}" colspan="9" style="text-align: center;"></td>
        </tr>
        </tbody>
    </table>
    <table th:if="${courseList}" id="listTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Subject</th>
            <th>Grade</th>
            <th>Chapters</th>
            <th>Lessons</th>
            <th>Status</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course:${courseList}">
            <td th:text="${course.getId()}"></td>
            <td th:text="${course.getTitle()}"></td>
            <td th:text="${course.getSubject()}"></td>
            <td th:text="${course.getGradeName()}"></td>
            <td th:text="${course.getNumberOfChapters()}"></td>
            <td th:text="${course.getNumberOfLessons()}"></td>
            <td th:text="${course.getCourseStatus()}"></td>
            <td>
                <button class="desc-btn" onclick="showPopup(this)"><i class="fa-solid fa-bars-staggered"></i></button>
                <span class="description-text" hidden th:text="${course.getDescription()}"></span>
            </td>
            <td class="actions">
                <div class="top-actions">
                    <form action="/teacher/edit" method="POST" style="display: inline">
                        <input type="hidden" name="numberOfLessons" th:value="${course.getNumberOfLessons()}">
                        <input type="hidden" name="courseId" th:value="${course.getId()}" />
                        <button type="submit" class="edit-btn" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                    </form>
                    <button onclick="viewCourseDetails(this)" title="Students View"><i class="fa-solid fa-chalkboard-user"></i></button>
                    <a hidden id="viewCourseDetailsRequest" th:href="@{/course/details/{id}(id=${course.getId()})}"></a>
                    <form action="/teacher/chapter" method="GET">
                        <input type="hidden" name="userId" th:value="${user.getId()}">
                        <input type="hidden" name="courseId" th:value="${course.getId()}" />
                        <button type="submit" class="view-btn" title="View chapters list"><i class="fa-solid fa-bookmark"></i></button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
    <div id="descPopup" class="popup hidden">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup()">&times;</span>
            <p id="popupText"></p>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const avatarBtn = document.querySelector(".expertAvatar button");
        const avatarDropdown = document.querySelector(".expertAvatar");

        avatarBtn.addEventListener("click", function (event) {
            event.stopPropagation();
            avatarDropdown.classList.toggle("active");
        });

        document.addEventListener("click", function () {
            avatarDropdown.classList.remove("active");
        });

        avatarDropdown.addEventListener("click", function (event) {
            event.stopPropagation();
        });
    });
    function showPopup(button) {
        document.getElementById("popupText").textContent = button.nextElementSibling.textContent;
        document.getElementById("descPopup").classList.remove("hidden");
    }

    function closePopup() {
        document.getElementById("descPopup").classList.add("hidden");
    }
    $(document).ready(function () {
        $('#listTable').DataTable({
            "pageLength": 5,
            "lengthChange": false,
            "info": false,
            "searching": false
        });
    });
    function openSidebar() {
        document.getElementById("sidebar").classList.add("active");
        document.getElementById("overlay").classList.add("active");
    }

    function closeSidebar() {
        document.getElementById("sidebar").classList.remove("active");
        document.getElementById("overlay").classList.remove("active");
    }

    function viewCourseDetails(button) {
        let link = button.parentElement.querySelector("#viewCourseDetailsRequest");
        if (link) {
            link.click();
        }
    }
    function viewSubjectList(e){
        let form = document.querySelector('#viewSubjectList')
        form.submit();
    }
    function viewDashBoard(e){
        let form = document.querySelector('#viewDashboard');
        form.submit();
    }
</script>
</body>

</html>
