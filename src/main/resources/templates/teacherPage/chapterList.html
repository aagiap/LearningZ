<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter List</title>
    <link rel="stylesheet" th:href="@{/css/chapterListStyle.css}">
    <!-- Thư viện jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
</head>

<body>
<div class="expertNavigation">
    <div class="logo-container">
        <a href="/home">
            <img src="/image/learningz.png" alt="Logo">
        </a>
        <span class="logo-text">Learning<span class="highlight">Z</span></span>
        <div id="overlay" class="overlay" onclick="closeSidebar()"></div>

        <div id="sidebar" class="sidebar">
            <button onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
            <br>
            <ul>
                <li>
                    <a href="#" onclick="viewDashBoard(this)">📊 Dashboard</a>
                    <form action="/teacher/dashboard" id="viewDashboard">
                        <input type="hidden" name="userId" th:value="${user.getId()}">
                    </form>
                </li>
                <li><a href="/teacher">📚 Courses Management</a></li>
                <li>
                    <a href="#" onclick="viewSubjectList(this)">📖 Subjects List</a>
                    <form action="/teacher/subject" id="viewSubjectList">
                        <input type="number" name="userId" th:value="${user.getId()}" hidden>
                    </form>
                </li>
                <li><a href="/teacher/questionList">❓ Question List</a></li>
            </ul>
        </div>

        <button id="openSidebarBtn" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></button>
    </div>
    <div class="rightNav">
        <div class="expertAvatar">
            <button>
                <img th:src="${user.getAvtUrl()}" alt="Avatar">
            </button>
            <ul class="dropdownMenu">
                <li><a href="/home/profile">Profile</a></li>
                <li><a href="/home/change_password">Change password</a></li>
                <li><a href="/logout">Log out</a></li>
            </ul>
        </div>
        <label>Teacher:</label>
        <p th:text="${user.getUsername()}"></p>
    </div>
</div>
<div class="container">
    <h2>Chapter List</h2>

    <div class="filter-section">
        <form action="/teacher/chapter/search">
            <input type="hidden" name="userId" th:value="${user.getId()}">
            <input name="courseId" type="text" hidden th:value="${courseId}">
            <input name="chapterSearchKey" type="text" id="searchInput" placeholder="Search chapter by title">
            <input type="submit" value="Search">
        </form>

        <div>
            <button id="returnCourseButton" onclick="returnCourse()"><i class="fa-solid fa-rotate-left"></i> Return Course List</button>
            <a href="/teacher" hidden id="returnCourse">Return Course</a>
            <button id="addChapter" onclick="addChapterRequest()">+ Add New Chapter</button>
            <form action="/teacher/chapter/addChapter" method="get" id="addChapterRequest">
                <input type="hidden" name="userId" th:value="${user.getId()}">
                <input type="number" name="courseId" th:value="${courseId}" hidden>
            </form>
        </div>

    </div>

    <table th:if="${notification}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Order</th>
            <th>Course Title</th>
            <th>Chapter Title</th>
            <th>Lessons</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td th:text="${notification}" colspan="9" style="text-align: center;"></td>
        </tr>
        </tbody>
    </table>
    <table th:if="${chapterList}" id="listTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Order</th>
            <th>Course Title</th>
            <th>Chapter Title</th>
            <th>Lessons</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="chapter:${chapterList}">
            <td th:text="${chapter.getId()}"></td>
            <td th:text="${chapter.getChapterOrder()}"></td>
            <td th:text="${chapter.getCourseTitle()}"></td>
            <td th:text="${chapter.getChapterTitle()}"></td>
            <td th:text="${chapter.getNumberOfLessons()}"></td>
            <td>
                <button class="desc-btn" onclick="showPopup(this)"><i class="fa-solid fa-bars-staggered"></i></button>
                <span class="description-text" hidden th:text="${chapter.getDescription()}"></span>
            </td>
            <td class="actions">
                <div class="top-actions">
                    <form action="/teacher/chapter/edit" method="POST" style="display: inline">
                        <input type="hidden" name="userId" th:value="${user.getId()}">
                        <input type="hidden" name="chapterId" th:value="${chapter.getId()}"/>
                        <button type="submit" class="edit-btn" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                    </form>
                    <form action="/teacher/chapter/lesson" method="get">
                        <input type="hidden" name="userId" th:value="${user.getId()}">
                        <input type="hidden" name="chapterId" th:value="${chapter.getId()}"/>
                        <button type="submit" class="view-btn" title="View Lessons"><i class="fa-solid fa-bookmark"></i></button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
    <div id="descPopup" class="popup hidden">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup()">&times;</span>
            <p id="popupText"></p>
        </div>
    </div>
</div>
<script>
    function showPopup(button) {
        // Lấy nội dung mô tả từ phần tử span
        document.getElementById("popupText").textContent = button.nextElementSibling.textContent; // Gán nội dung vào popup
        document.getElementById("descPopup").classList.remove("hidden"); // Hiện popup
    }

    function closePopup() {
        document.getElementById("descPopup").classList.add("hidden"); // Ẩn popup khi bấm nút đóng
    }

    function addChapterRequest() {
        document.querySelector('#addChapterRequest').submit();
    }

    function returnCourse() {
        document.querySelector('#returnCourse').click();
    }
    function viewSubjectList(e){
        let form = document.querySelector('#viewSubjectList')
        form.submit();
    }
    document.addEventListener("DOMContentLoaded", function () {
        const avatarBtn = document.querySelector(".expertAvatar button");
        const avatarDropdown = document.querySelector(".expertAvatar");

        avatarBtn.addEventListener("click", function (event) {
            event.stopPropagation();
            avatarDropdown.classList.toggle("active");
        });

        document.addEventListener("click", function () {
            avatarDropdown.classList.remove("active");
        });

        avatarDropdown.addEventListener("click", function (event) {
            event.stopPropagation();
        });
    });
    $(document).ready(function () {
        $('#listTable').DataTable({
            "pageLength": 5,
            "lengthChange": false,
            "info": false,
            "searching": false
        });
    });
    function openSidebar() {
        document.getElementById("sidebar").classList.add("active");
        document.getElementById("overlay").classList.add("active");
    }

    function closeSidebar() {
        document.getElementById("sidebar").classList.remove("active");
        document.getElementById("overlay").classList.remove("active");
    }
    function viewDashBoard(e){
        let form = document.querySelector('#viewDashboard');
        form.submit();
    }
</script>
</body>

</html>
