<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video List</title>
    <link rel="stylesheet" th:href="@{/css/videoListStyle.css}">
    <!-- Thư viện jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
</head>
<body>
<div class="expertNavigation">
    <div class="logo-container">
        <a href="/home">
            <img src="/image/learningz.png" alt="Logo">
        </a>
        <span class="logo-text">Learning<span class="highlight">Z</span></span>
        <div id="overlay" class="overlay" onclick="closeSidebar()"></div>

        <div id="sidebar" class="sidebar">
            <button onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
            <br>
            <ul>
                <li><a href="#">📊 Dashboard</a></li>
                <li><a href="/teacher">📚 Courses Management</a></li>
                <li>
                    <a href="#" onclick="viewSubjectList(this)">📖 Subjects List</a>
                    <form action="/teacher/subject" id="viewSubjectList">
                        <input type="number" name="userId" th:value="${user.getId()}" hidden>
                    </form>
                </li>
            </ul>
        </div>

        <button id="openSidebarBtn" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></button>
    </div>
    <div class="rightNav">
        <div class="expertAvatar">
            <button>
                <img th:src="${user.getAvtUrl()}" alt="Avatar">
            </button>
            <ul class="dropdownMenu">
                <li><a href="/home/profile">Profile</a></li>
                <li><a href="/home/change_password">Change password</a></li>
                <li><a href="/logout">Log out</a></li>
            </ul>
        </div>
        <label>Teacher:</label>
        <p th:text="${user.getUsername()}"></p>
    </div>
</div>
<div class="container">
    <h2>Video List</h2>

    <div class="filter-section">
        <form action="/teacher/chapter/lesson/videos/search">
            <input type="hidden" name="userId" th:value="${user.getId()}">
            <input name="lessonId" type="text" hidden th:value="${lessonId}">
            <input name="videoSearchKey" type="text" id="searchInput" placeholder="Search video by title">
            <input type="submit" value="Search">
        </form>

        <div>
            <button id="returnLessonButton" onclick="returnLesson()"><i class="fa-solid fa-rotate-left"></i> Return Lesson List</button>
            <form action="/teacher/chapter/lesson" method="get" id="returnLesson">
                <input type="hidden" name="userId" th:value="${user.getId()}">
                <input type="number" name="chapterId" th:value="${chapterId}" hidden>
            </form>
            <button id="addVideo" onclick="addVideoRequest()">+ Add New Video</button>
            <form action="/teacher/chapter/lesson/videos/addVideo" method="get" id="addVideoRequest">
                <input type="hidden" name="userId" th:value="${user.getId()}">
                <input type="number" name="lessonId" th:value="${lessonId}" hidden>
            </form>
        </div>

    </div>

    <table th:if="${notification}">
        <thead>
        <tr>
            <th>Lesson ID</th>
            <th>Video ID</th>
            <th>Video Title</th>
            <th>File URL</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td th:text="${notification}" colspan="9" style="text-align: center;"></td>
        </tr>
        </tbody>
    </table>
    <table th:if="${videoList}" id="listTable">
        <thead>
        <tr>
            <th>Lesson ID</th>
            <th>Video ID</th>
            <th>Video Title</th>
            <th>File URL</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="video:${videoList}">
            <td th:text="${video.getLesson().getId()}"></td>
            <td th:text="${video.getId()}"></td>
            <td th:text="${video.getTitle()}"></td>
            <td th:text="${video.getFileUrl()}"></td>
            <td class="actions">
                <div class="top-actions">
                    <form action="/teacher/chapter/lesson/videos/edit" method="POST" style="display: inline">
                        <input type="hidden" name="userId" th:value="${user.getId()}">
                        <input type="hidden" name="videoId" th:value="${video.getId()}"/>
                        <button type="submit" class="edit-btn" title="Edit video material"><i class="fa-solid fa-pen-to-square"></i></button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script>
    function addVideoRequest() {
        document.querySelector('#addVideoRequest').submit();
    }

    function returnLesson() {
        document.querySelector('#returnLesson').submit();
    }

    function viewSubjectList(e) {
        let form = document.querySelector('#viewSubjectList')
        form.submit();
    }

    document.addEventListener("DOMContentLoaded", function () {
        const avatarBtn = document.querySelector(".expertAvatar button");
        const avatarDropdown = document.querySelector(".expertAvatar");

        avatarBtn.addEventListener("click", function (event) {
            event.stopPropagation();
            avatarDropdown.classList.toggle("active");
        });

        document.addEventListener("click", function () {
            avatarDropdown.classList.remove("active");
        });

        avatarDropdown.addEventListener("click", function (event) {
            event.stopPropagation();
        });
    });
    $(document).ready(function () {
        $('#listTable').DataTable({
            "pageLength": 5,
            "lengthChange": false,
            "info": false,
            "searching": false
        });
    });

    function openSidebar() {
        document.getElementById("sidebar").classList.add("active");
        document.getElementById("overlay").classList.add("active");
    }

    function closeSidebar() {
        document.getElementById("sidebar").classList.remove("active");
        document.getElementById("overlay").classList.remove("active");
    }
</script>
</body>

</html>
