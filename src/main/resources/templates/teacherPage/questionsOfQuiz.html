    <style>
        .add-user-form {
            display: none;
        }

        #addUserCheck:checked + .add-user-form {
            display: block;
        }

        #addUserCheck:checked ~ .user-list {
            margin-top: 250px; /* Điều chỉnh khoảng cách khi form hiển thị */
        }

        .add-user-form {
            position: relative; /* Để h4 có thể đặt chồng lên viền */
            border: 2px solid #0d47a1; /* Viền xanh đậm */
            border-radius: 10px; /* Bo góc */
            padding: 20px;
            margin: 20px auto;
            width: 400px; /* Điều chỉnh độ rộng */
            background-color: #ffffff;
        }

        .form-title {
            position: absolute;
            top: -15px; /* Dịch lên trên viền */
            left: 20px;
            background: white; /* Giữ nền trắng để đè lên viền */
            padding: 0 10px; /* Tạo khoảng cách 2 bên */
            font-weight: bold;
            color: #0d47a1;
            font-size: 18px;
        }

        h3 {
            text-align: center; /* Căn giữa */
            font-size: 24px; /* Kích thước chữ */
            font-weight: bold; /* Độ đậm */
            color: #0d47a1; /* Màu xanh đậm */
            margin-top: 20px; /* Khoảng cách phía trên */
            margin-bottom: 20px; /* Khoảng cách phía dưới */
            padding: 10px 0; /* Thêm padding để không quá sát */
            border-bottom: 2px solid #0d47a1; /* Viền dưới tạo điểm nhấn */
            display: inline-block; /* Giữ nội dung gọn gàng */
        }

    </style>

                            <tbody>
                            <tr th:each="question, index : ${questions}">
