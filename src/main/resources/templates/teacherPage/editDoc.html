<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Detail Setting</title>
    <link rel="stylesheet" th:href="@{/css/editDocStyle.css}">
    <!-- Thư viện jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
</head>
<body>
<div class="expertNavigation">
    <div class="logo-container">
        <a href="/home">
            <img src="/image/learningz.png" alt="Logo">
        </a>
        <span class="logo-text">Learning<span class="highlight">Z</span></span>
        <div id="overlay" class="overlay" onclick="closeSidebar()"></div>

        <div id="sidebar" class="sidebar">
            <button onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
            <br>
            <ul>
                <li>
                    <a href="#" onclick="viewDashBoard(this)">📊 Dashboard</a>
                    <form action="/teacher/dashboard" id="viewDashboard">
                        <input type="hidden" name="userId" th:value="${user.getId()}">
                    </form>
                </li>
                <li><a href="/teacher">📚 Courses Management</a></li>
                <li>
                    <a href="#" onclick="viewSubjectList(this)">📖 Subjects List</a>
                    <form action="/teacher/subject" id="viewSubjectList">
                        <input type="number" name="userId" th:value="${user.getId()}" hidden>
                    </form>
                </li>
                <li><a href="/teacher/questionList">❓ Question List</a></li>
            </ul>
        </div>

        <button id="openSidebarBtn" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></button>
    </div>
    <div class="rightNav">
        <div class="expertAvatar">
            <button>
                <img th:src="${user.getAvtUrl()}"
                     src="https://lh3.googleusercontent.com/d/1PR3JqFmR2l4O4BE_dVBoRTjT0Se7GLw9" alt="Avatar">
            </button>
            <ul class="dropdownMenu">
                <li><a href="/home/profile">Profile</a></li>
                <li><a href="/home/change_password">Change password</a></li>
                <li><a href="/logout">Log out</a></li>
            </ul>
        </div>
        <label>Teacher:</label>
        <p th:text="${user.getUsername()}"></p>
    </div>
</div>
<div class="container">
    <h2>Document Detail Setting</h2>

    <form action="/teacher/chapter/lesson/docs/edit/update" method="post" enctype="multipart/form-data">
        <input type="hidden" name="userId" th:value="${user.getId()}">
        <input type="hidden" name="lessonId" th:value="${pdf.lesson.getId()}">
        <input type="hidden" name="docId" th:value="${pdf.getId()}">

        <label>Title:</label>
        <input type="text" name="docTitle" th:value="${pdf.getTitle()}" required>

        <label>Document Url:</label>
        <input type="file" id="docUrl" name="docUrl" accept=".pdf, .docx">

        <div class="btn-group">
            <button type="submit" class="save-btn">Save</button>
            <button type="button" class="cancel-btn" onclick="closeEditForm()">Exit</button>
        </div>
    </form>
    <div id="viewCurrentPdf">
        <iframe id="currentPdf" th:src="${pdf.getFileUrl()}" width="750" height="500" allow="autoplay"></iframe>
    </div>
    <div id="previewContainer" style="margin-top: 10px;">
        <iframe id="pdfPreview" th:if="${pdf.getFileUrl().endsWith('.pdf')}" th:src="@{${pdf.getFileUrl()}}" width="750"
                height="500"></iframe>
        <p id="docxMessage" th:if="${pdf.getFileUrl().endsWith('.docx')}" style="color: red;">
            Không thể xem trước file DOCX. Vui lòng tải xuống để xem.
        </p>
    </div>
    <!-- Hiển thị lỗi -->
    <div th:if="${error}" class="error-messages">
        <p th:text="${error}"></p>
    </div>

    <!-- Hiển thị thông báo thành công -->
    <div th:if="${notification}" class="success-message">
        <p th:text="${notification}"></p>
    </div>

    <form action="/teacher/chapter/lesson/docs" method="get" id="returnVideoList">
        <input type="hidden" name="userId" th:value="${user.getId()}">
        <input type="number" name="lessonId" th:value="${pdf.lesson.getId()}" hidden>
    </form>

</div>

<script>
    function closeEditForm() {
        document.querySelector('#returnVideoList').submit();
    }

    document.getElementById("docUrl").addEventListener("change", function (event) {
        const file = event.target.files[0]; // Lấy file mới
        const previewContainer = document.getElementById("previewContainer");
        const currentPdfContainer = document.getElementById("viewCurrentPdf"); // Lấy div của file cũ

        // Ẩn file cũ nếu có
        if (currentPdfContainer) {
            currentPdfContainer.style.display = "none";
        }

        // Xóa tất cả nội dung trong previewContainer để ẩn file cũ đã hiển thị trước đó
        previewContainer.innerHTML = "";

        if (file) {
            const fileType = file.name.split('.').pop().toLowerCase();
            const fileURL = URL.createObjectURL(file);

            // Tạo và hiển thị file mới
            if (fileType === "pdf") {
                const newIframe = document.createElement("iframe");
                newIframe.width = "750";
                newIframe.height = "500";
                newIframe.src = fileURL;
                previewContainer.appendChild(newIframe);
            } else if (fileType === "docx") {
                const newMessage = document.createElement("p");
                newMessage.style.color = "red";
                newMessage.innerText = "Không thể xem trước file DOCX. Vui lòng tải xuống để xem.";
                previewContainer.appendChild(newMessage);
            }
        }
    });
    document.addEventListener("DOMContentLoaded", function () {
        const avatarBtn = document.querySelector(".expertAvatar button");
        const avatarDropdown = document.querySelector(".expertAvatar");

        avatarBtn.addEventListener("click", function (event) {
            event.stopPropagation();
            avatarDropdown.classList.toggle("active");
        });

        // Ẩn menu khi click bên ngoài
        document.addEventListener("click", function () {
            avatarDropdown.classList.remove("active");
        });

        avatarDropdown.addEventListener("click", function (event) {
            event.stopPropagation();
        });
    });
    $(document).ready(function () {
        $('#listTable').DataTable({
            "pageLength": 5, // Hiển thị 5 hàng mỗi trang
            "lengthChange": false, // Ẩn dropdown chọn số hàng
            "info": false, // Ẩn thông tin số dòng
            "searching": false
        });
    });

    function openSidebar() {
        document.getElementById("sidebar").classList.add("active");
        document.getElementById("overlay").classList.add("active");
    }

    function closeSidebar() {
        document.getElementById("sidebar").classList.remove("active");
        document.getElementById("overlay").classList.remove("active");
    }

    function viewSubjectList(e) {
        let form = document.querySelector('#viewSubjectList')
        form.submit();
    }

    function viewDashBoard(e){
        let form = document.querySelector('#viewDashboard');
        form.submit();
    }
</script>

</body>
</html>
