<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" th:href="@{/css/profile_editStyle.css}" />
</head>
<body>
    <div class="navbar">
        <a href="/home">Home</a>
        <a href="#learn">Courses</a>
        <a href="#ask">Forum</a>
        <a href="#test">Practice</a>
        <a href="#help">Help</a>
        <a href="#about">About us</a>
    </div>
    <div class="container">
        <form method="post" action="/home/profile/profile_edit/update_user" enctype="multipart/form-data">
        <h1>Edit Profile</h1>
            <input name="userId" th:value="${userId}" hidden>
            <div class="form-group">
                <label for="profilePicture">Profile Picture</label>
                <img id="avatarPreview" th:src="${avatarUrl}" alt="Profile Picture">
                <input name="avatarUrl" type="file" id="profilePicture" accept="image/*" onchange="previewImage(event)">
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input name="username" type="text" id="username" th:value="${username}">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input name="email" type="email" id="email" th:value="${email}">
            </div>
            <div class="form-group">
                <label for="phoneNum">Phone number</label>
                <input name="phoneNumber" type="tel" id="phoneNum" th:value="${phoneNumber != null} ? ${phoneNumber} : '' "
                       oninput="this.value = this.value.replace(/[^0-9]/g, '')" >
            </div>
            <div class="actions">
                <button type="submit" id="saveChanges">Save Changes</button>
                <button type="button" id="cancel" onclick="location.href='/home/profile'">Cancel</button>
            </div>
        </form>

        <!-- Hiển thị danh sách lỗi -->
        <div th:if="${errors}" class="error-messages">
            <ul>
                <li th:each="error : ${errors}" th:text="${error}" class="error-item"></li>
            </ul>
        </div>

        <!-- Hiển thị thông báo thành công -->
        <div th:if="${notification}" class="success-message">
            <p th:text="${notification}"></p>
        </div>
    </div>
    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('avatarPreview');
                output.src = reader.result;
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>

</body>

</html>
