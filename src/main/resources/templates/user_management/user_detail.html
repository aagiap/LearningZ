<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/UserManagement.css">
</head>
<body>
<div class="container-xl">
    <div class="table-responsive">
        <div class="table-wrapper">
            <h2 >User Detail</h2>

            <div th:if="${errorMessage}" class="alert alert-danger">
                <p th:text="${errorMessage}"></p>
            </div>

            <div class="container" style="max-width: 800px; margin: 40px auto;">
                <div class="row">
                    <div class="col-md-4 text-center">
                        <div class="avatar-container">
                            <img th:src="@{/image/AvartaDefault.jpg}" alt="User Avatar" class="avatar img-thumbnail" style="width: 150px; height: 150px;">
                        </div>
                    </div>

                    <div class="col-md-8">
                        <form th:object="${user}" method="post" action="/admin/users/update" enctype="multipart/form-data">
                            <div class="form-group">
                                <label>ID</label>
                                <input th:field="*{id}" type="text" class="form-control" readonly required>
                            </div>

                            <div class="form-group">
                                <label>Username</label>
                                <input th:field="*{username}" type="text" class="form-control" readonly required>
                            </div>

                            <div class="form-group">
                                <label>Password</label>
                                <input th:field="*{password}" type="password" class="form-control">
                            </div>

                            <div class="form-group">
                                <label>Email</label>
                                <input th:field="*{email}" type="email" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label>Phone number</label>
                                <input th:field="*{phoneNum}" type="text" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label>Role</label>
                                <select class="form-select" th:field="*{role}" required>
                                    <option value="ADMIN">ADMIN</option>
                                    <option value="STUDENT">STUDENT</option>
                                    <option value="TEACHER">TEACHER</option>
                                    <option value="MARKETING_TEAM">MARKETING_TEAM</option>
                                </select>
                            </div>
                            <br>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" onclick="window.location.href='/admin/users'">Cancel</button>
                                <input type="submit" class="btn btn-info" value="Save">
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
