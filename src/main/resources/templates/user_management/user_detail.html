<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/changePass.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<body>
<div class="container-xl">
    <div class="table-responsive">
        <div class="table-wrapper">
            <h2>User Detail</h2>

            <form th:object="${user}" method="post" action="/admin/users/update">
                <div class="container" style="width:500px; margin: 40px auto;">
                    <div class="form-group">
                        <label>ID</label>
                        <input th:field="*{id}" type="text" class="form-control" readonly required>
                    </div>

                    <div class="form-group">
                        <label>Username</label>
                        <input th:field="*{username}" type="text" class="form-control" readonly required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input th:field="*{password}" type="password" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input th:field="*{email}" type="email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Phone number</label>
                        <input th:field="*{phoneNum}" type="text" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Role</label>

                        <select class="form-select" th:field="*{role}" required>
                            <option value="ADMIN">ADMIN</option>
                            <option value="STUDENT">STUDENT</option>
                            <option value="EXPERT">EXPERT</option>
                            <option value="MARKETING_TEAM">MARKETING_TEAM</option>
                        </select>
                    </div>
                    <br>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-default" onclick="window.location.href='/admin/users'">Cancel</button>
                        <input type="submit" class="btn btn-info" value="Save">
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>
</body>
</html>
