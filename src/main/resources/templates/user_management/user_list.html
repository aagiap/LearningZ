<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/changePass.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .add-user-form {
            display: none;
        }

        #addUserCheck:checked + .add-user-form {
            display: block;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-end mt-3">
        <a href="#" class="text-dark me-3" title="Settings">
            <i class="fas fa-cogs"></i> <!-- Biểu tượng Cài đặt -->
        </a>
        <a href="#" class="text-dark" title="User">
            <i class="fas fa-user"></i> <!-- Biểu tượng User -->
        </a>
    </div>

    <h2 class="mt-3">User Management</h2>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>


    <!--add-->
    <label for="addUserCheck" class="btn btn-success mb-3">Add User</label>
    <input type="checkbox" id="addUserCheck" style="display:none;"/>

    <div class="add-user-form">
        <h4>Add New User</h4>
        <form action="/admin/users/create" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="text" class="form-control" id="password" name="password" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="phone" name="phone" required>
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="ADMIN">ADMIN</option>
                    <option value="STUDENT">STUDENT</option>
                    <option value="TEACHER">TEACHER</option>
                    <option value="MARKETING_TEAM">MARKETING_TEAM</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <!--search-->
    <form method="get" action="/admin/users" class="mb-3 d-flex justify-content-start" style="max-width: 400px; margin: 0 auto;">
        <input type="text" name="keyword" id="keyword" th:value="${keyword}" class="form-control me-2" placeholder="Search users...">
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>
                <a th:href="@{/admin/users(sort='id', order=${order == 'asc' ? 'desc' : 'asc'}, keyword=${keyword})}">
                    ID <span th:text="${sortField == 'id' ? (order == 'asc' ? '▲' : '▼') : '⇅'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/admin/users(sort='username', order=${order == 'asc' ? 'desc' : 'asc'}, keyword=${keyword})}">
                    UserName <span th:text="${sortField == 'username' ? (order == 'asc' ? '▲' : '▼') : '⇅'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/admin/users(sort='email', order=${order == 'asc' ? 'desc' : 'asc'}, keyword=${keyword})}">
                    Email <span th:text="${sortField == 'email' ? (order == 'asc' ? '▲' : '▼') : '⇅'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/admin/users(sort='phoneNum', order=${order == 'asc' ? 'desc' : 'asc'}, keyword=${keyword})}">
                    Phone Number <span th:text="${sortField == 'phoneNum' ? (order == 'asc' ? '▲' : '▼') : '⇅'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/admin/users(sort='role', order=${order == 'asc' ? 'desc' : 'asc'}, keyword=${keyword})}">
                    Role <span th:text="${sortField == 'role' ? (order == 'asc' ? '▲' : '▼') : '⇅'}"></span>
                </a>
            </th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.phoneNum}"></td>
            <td th:text="${user.role}"></td>
            <td>
                <a th:href="@{/admin/users/{id}(id=${user.id})}" class="text-primary me-2" title="View">
                    <i class="fas fa-eye"></i>
                </a>
                <a th:href="@{/admin/users/{id}(id=${user.id})}" class="text-primary me-2" title="Edit">
                    <i class="fas fa-pencil-alt"></i>
                </a>
                <form action="/admin/users/delete" method="post" style="display:inline;"
                      onsubmit="return confirmDelete(this);">
                    <input type="hidden" name="id" th:value="${user.id}" />
                    <button type="submit" class="btn btn-link text-danger" title="Delete">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </form>
                <script>
                    function confirmDelete(form) {
                        return confirm("Are you sure you want to delete this user?");
                    }
                </script>

            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
